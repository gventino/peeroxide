[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 3

# libde265 (C++) is built by a workspace crate, which the rule above doesn't cover. Unoptimized,
# it decodes about 2.5 times slower (720p: 8.4 instead of 3.2 ms per frame).
[profile.dev.package.peeroxide-de265-sys]
opt-level = 3
