[package]
name = "peeroxide"
description = "Peer-to-peer LAN screen sharing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
eframe = "0.36.2"
gethostname = "1.1.0"
if-addrs = "0.15"
peeroxide-audio = { path = "../audio" }
peeroxide-capture = { path = "../capture" }
peeroxide-codec = { path = "../codec" }
peeroxide-discovery = { path = "../discovery" }
peeroxide-net = { path = "../net" }
peeroxide-update = { path = "../update" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"
