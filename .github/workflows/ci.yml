name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config nasm libclang-dev libpipewire-0.3-dev libdbus-1-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev

      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Hosted runners don't reliably support multicast, so the real mDNS round trip is skipped here.
      - run: cargo test --workspace -- --skip announce_is_discovered_and_withdraw_removes_it
